<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Memory Verses</title>
<meta name="theme-color" content="#e8f4ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111a33" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Verses">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root {
  --bg: #e8f4ff; --surface: #ffffff; --ink: #1c2a52; --muted: #5b6b8f; --line: #c9ddf3;
  --honey: #ffc21a; --honey-soft: #ffd54a; --honey-ink: #3d2a00;
  --green: #1f9d5c; --green-soft: #c9f1d9; --learn-soft: #ffe8a3; --danger: #d63f2e;
  --c1: #3b82f6; --c2: #ff6b57; --c3: #8b5cf6; --c4: #1f9d5c;
  --font-display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-verse: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111a33; --surface: #1b2748; --ink: #f1f5ff; --muted: #a3b2d6; --line: #2f3f6b;
    --honey: #ffc21a; --honey-soft: #ffc21a; --honey-ink: #3d2a00;
    --green: #5fe09b; --green-soft: #17403a; --learn-soft: #4a3a0c; --danger: #ff8a7a;
    --c1: #6aa5ff; --c2: #ff8b7a; --c3: #b196ff; --c4: #5fe09b;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.45;
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--font-display); font-size: 1.8rem; margin: 0; color: var(--c1); letter-spacing: -0.01em; }
h2 { font-family: var(--font-display); font-size: 1.35rem; margin: 0; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sync { color: var(--muted); font-size: .8rem; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }

nav.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 10px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--surface); border-top: 2px solid var(--line);
}
nav.bottom button { flex: 1; max-width: 240px; border: 2px solid var(--line); background: transparent; border-radius: 999px; padding: 10px 14px; font-weight: 700; color: var(--muted); }
nav.bottom button[aria-current="page"] { background: var(--c1); border-color: var(--c1); color: #fff; }
nav.bottom .count { background: var(--c2); color: #fff; border-radius: 999px; padding: 0 8px; margin-left: 6px; font-size: .85rem; }

.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { --tc: var(--c1); border: 2px solid var(--tc); background: var(--surface); border-radius: 999px; padding: 8px 16px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; }
.tab:nth-child(2) { --tc: var(--c2); }
.tab small { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { background: var(--tc); color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.tab[aria-selected="true"] small { color: #fff; opacity: .85; }

.link { background: none; border: 0; padding: 6px 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.bar { height: 16px; border-radius: 999px; background: var(--surface); border: 2px solid var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .d { background: var(--green); } .bar .l { background: var(--honey); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: .85rem; margin-top: 6px; }
.legend b { color: var(--ink); }

.now {
  background: var(--honey-soft); color: var(--honey-ink); border-radius: 22px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 4px 0 rgba(0,0,0,.14);
  background-image: radial-gradient(circle at 100% 0, rgba(255,255,255,.55) 0 60px, transparent 61px), radial-gradient(circle at 92% 100%, rgba(255,255,255,.3) 0 36px, transparent 37px);
}
.label { text-transform: uppercase; letter-spacing: .08em; font-size: .72rem; font-weight: 700; color: var(--muted); }
.now .label { color: var(--honey-ink); opacity: .8; }
.now .ref { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; }
.txt { font-family: var(--font-verse); font-size: 1.25rem; line-height: 1.4; margin: 0; max-width: 60ch; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 2px solid transparent; border-radius: 999px; padding: 10px 18px; font-weight: 700; background: var(--c1); color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
.btn.ghost { background: transparent; border-color: currentColor; color: inherit; box-shadow: none; }
.btn.green { background: var(--green); color: #fff; }
.btn[disabled] { opacity: .5; }

.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 2px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; color: var(--muted); font-size: .9rem; }
.chip[aria-pressed="true"] { background: var(--c1); color: #fff; border-color: var(--c1); font-weight: 700; }

.list { display: flex; flex-direction: column; gap: 10px; }
.v { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 14px 16px; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; align-items: start; }
.v.cur { border-color: var(--honey); box-shadow: 0 0 0 3px var(--honey-soft); }
.v.done { border-color: var(--green-soft); }
.v .meta { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.v .r { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
.v.done .r::after { content: " \2713"; color: var(--green); }
.v .tag { color: var(--muted); font-size: .8rem; }
.v .t { font-family: var(--font-verse); margin: 2px 0 0; max-width: 60ch; overflow-wrap: anywhere; }
.v.done .t { color: var(--muted); }
.v .acts { display: flex; gap: 14px; margin-top: 4px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-size: .85rem; color: var(--muted); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--line); color: var(--ink); font-weight: 700; }
.seg button[aria-pressed="true"].s-learning { background: var(--learn-soft); color: var(--honey-ink); }
.seg button[aria-pressed="true"].s-done { background: var(--green); color: #fff; }
@media (max-width: 520px) { .v { grid-template-columns: minmax(0, 1fr); } }

.vt { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.vt .seg button { padding: 4px 12px; font-size: .8rem; }
.vt p.hint { letter-spacing: .14em; word-spacing: .4em; }
.vt p.hidden-v { font-style: italic; color: var(--muted); }
.now .vt p.hidden-v { color: inherit; opacity: .75; }

details.add { background: var(--surface); border: 2px dashed var(--c3); border-radius: 18px; padding: 12px 16px; }
details.add summary { cursor: pointer; font-weight: 600; }
form { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
form label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
form input, form textarea { border: 2px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; width: 100%; font-size: 1rem; }
form textarea { min-height: 84px; resize: vertical; font-family: var(--font-verse); }

.card { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.card .ref { font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; color: var(--c1); }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grades button { border: 2px solid var(--line); background: var(--bg); border-radius: 16px; padding: 10px 4px; font-weight: 700; display: flex; flex-direction: column; gap: 2px; align-items: center; }
.grades small { color: var(--muted); font-weight: 600; }
.grades .g0 { border-color: var(--danger); } .grades .g1 { border-color: var(--honey); } .grades .g2 { border-color: var(--green); } .grades .g3 { border-color: var(--c1); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 12px 14px; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.8rem; font-variant-numeric: tabular-nums; }
.up { display: flex; justify-content: space-between; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.up span:last-child { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.note, .empty { color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; max-width: calc(100% - 32px); }
.login { max-width: 380px; margin: 8vh auto 0; display: flex; flex-direction: column; gap: 10px; }
.err { color: var(--danger); min-height: 1.3em; }
.foot { color: var(--muted); font-size: .85rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main id="app"><p class="note">Loading…</p></main>
<nav class="bottom" id="nav" hidden></nav>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="seed.js"></script>
<script src="srs.js"></script>
<script src="app.js"></script>
</body>
</html>
